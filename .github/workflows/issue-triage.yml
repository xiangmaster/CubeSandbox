name: Issue Triage
on:
  issues:
    types: [opened]

jobs:
  triage-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      
      - uses: anthropics/claude-code-action@v1
        env:
            ANTHROPIC_BASE_URL: https://api.openlux.ai
            ANTHROPIC_MODEL: claude-sonnet-4-6
            ANTHROPIC_SMALL_FAST_MODEL: claude-sonnet-4-6
            CLAUDE_CODE_SCRIPT_CAPS: '{"edit-issue-labels.sh":2}'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/label-issue REPO: ${{ github.repository }} ISSUE_NUMBER: ${{ github.event.issue.number }}"
          allowed_non_write_users: "*" # Required for issue triage workflow, if users without repo write access create issues
          github_token: ${{ github.token }}
          show_full_output: true
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(./scripts/gh.sh:*),Bash(./scripts/edit-issue-labels.sh:*)"
